<style>
/* Modern Login Modal Styles */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(8px);
    z-index: 9999;
    align-items: center;
    justify-content: center;
}

.modal-overlay.active {
    display: flex;
}

.login-modal {
    background: #ffffff;
    width: 100%;
    max-width: 420px;
    border-radius: 20px;
    padding: 3rem 2.5rem;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    position: relative;
    transform: translateY(20px) scale(0.95);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    font-family: 'Outfit', sans-serif;
    color: #0f172a;
}

.modal-overlay.active .login-modal {
    transform: translateY(0) scale(1);
    opacity: 1;
}

.modal-close {
    position: absolute;
    top: 1.2rem;
    right: 1.5rem;
    background: transparent;
    border: none;
    font-size: 1.8rem;
    color: #94a3b8;
    cursor: pointer;
    transition: color 0.2s;
    line-height: 1;
}

.modal-close:hover {
    color: #0f172a;
}

.modal-logo {
    text-align: center;
    font-size: 2.5rem;
    margin-bottom: 1rem;
}

.login-modal h2 {
    font-size: 1.75rem;
    font-weight: 800;
    color: #0f172a;
    margin-bottom: 0.5rem;
    text-align: center;
    letter-spacing: -0.5px;
}

.login-modal p {
    text-align: center;
    color: #64748b;
    margin-bottom: 2rem;
    font-size: 0.95rem;
}

/* Social Login */
.btn-social {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    width: 100%;
    padding: 0.75rem;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    color: #334155;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}

.btn-social:hover {
    background: #f8fafc;
    border-color: #cbd5e1;
}

.btn-social svg {
    width: 20px;
    height: 20px;
}

.divider {
    display: flex;
    align-items: center;
    text-align: center;
    margin: 1.5rem 0;
    color: #94a3b8;
    font-size: 0.85rem;
    font-weight: 500;
}

.divider::before,
.divider::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid #e2e8f0;
}

.divider:not(:empty)::before {
    margin-right: .75rem;
}

.divider:not(:empty)::after {
    margin-left: .75rem;
}

/* Form Styles */
.form-group {
    margin-bottom: 1.25rem;
}

.form-group label {
    display: block;
    font-weight: 600;
    color: #334155;
    margin-bottom: 0.5rem;
    font-size: 0.9rem;
}

.form-group input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    font-size: 1rem;
    transition: all 0.2s;
    font-family: inherit;
    box-sizing: border-box;
    background: #f8fafc;
}

.form-group input:focus {
    outline: none;
    border-color: #2563eb;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
}

.modal-btn {
    width: 100%;
    padding: 0.85rem;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 0.5rem;
    font-family: inherit;
    box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
}

.modal-btn:hover {
    background: #1d4ed8;
}

.modal-footer {
    margin-top: 1.5rem;
    text-align: center;
    font-size: 0.9rem;
    color: #64748b;
}

.modal-footer a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 600;
}

.modal-footer a:hover {
    text-decoration: underline;
}

.forgot-password {
    float: right;
    font-size: 0.85rem;
    color: #2563eb;
    text-decoration: none;
    font-weight: 500;
}

.forgot-password:hover {
    text-decoration: underline;
}
</style>

<div class="modal-overlay" id="loginModal">
    <div class="login-modal">
        <button class="modal-close" id="closeLoginModal">&times;</button>
        
        <div class="modal-logo">⚖️</div>
        <h2>Welcome to LegalAI</h2>
        <p>Sign in to access your legal workspace.</p>
        
        <button class="btn-social">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continue with Google
        </button>

        <div class="divider">or sign in with email</div>
        
        <form method="POST" action="#">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">Email Address</label>
                <input type="email" id="username" name="username" required placeholder="name@company.com">
            </div>
            <div class="form-group">
                <label for="password">
                    Password
                    <a href="#" class="forgot-password">Forgot?</a>
                </label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
            </div>
            <button type="submit" class="modal-btn">Log In to Workspace</button>
        </form>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const loginModal = document.getElementById("loginModal");
        const closeBtn = document.getElementById("closeLoginModal");
        
        const elements = document.querySelectorAll("a, button, span");
        
        elements.forEach(el => {
            if (el.textContent.trim() === "Log In") {
                el.addEventListener("click", function(e) {
                    e.preventDefault();
                    loginModal.classList.add("active");
                });
                el.style.cursor = 'pointer';
            }
        });

        closeBtn.addEventListener("click", function() {
            loginModal.classList.remove("active");
        });

        loginModal.addEventListener("click", function(e) {
            if (e.target === loginModal) {
                loginModal.classList.remove("active");
            }
        });
    });
</script>
