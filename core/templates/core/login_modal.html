<style>
/* Modern Login Modal Styles */
.modal-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(8px);
    z-index: 9999;
    align-items: center;
    justify-content: center;
}

.modal-overlay.active {
    display: flex;
}

.login-modal {
    background: #ffffff;
    width: 100%;
    max-width: 420px;
    border-radius: 20px;
    padding: 3rem 2.5rem;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    position: relative;
    transform: translateY(20px) scale(0.95);
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    font-family: 'Outfit', sans-serif;
    color: #0f172a;
}

.modal-overlay.active .login-modal {
    transform: translateY(0) scale(1);
    opacity: 1;
}

.modal-close {
    position: absolute;
    top: 1.2rem;
    right: 1.5rem;
    background: transparent;
    border: none;
    font-size: 1.8rem;
    color: #94a3b8;
    cursor: pointer;
    transition: color 0.2s;
    line-height: 1;
}

.modal-close:hover {
    color: #0f172a;
}

.modal-logo {
    text-align: center;
    font-size: 2.5rem;
    margin-bottom: 1rem;
}

.login-modal h2 {
    font-size: 1.75rem;
    font-weight: 800;
    color: #0f172a;
    margin-bottom: 0.5rem;
    text-align: center;
    letter-spacing: -0.5px;
}

.login-modal p {
    text-align: center;
    color: #64748b;
    margin-bottom: 2rem;
    font-size: 0.95rem;
}

/* Form Styles */
.form-group {
    margin-bottom: 1.25rem;
}

.form-group label {
    display: block;
    font-weight: 600;
    color: #334155;
    margin-bottom: 0.5rem;
    font-size: 0.9rem;
}

.form-group input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    font-size: 1rem;
    transition: all 0.2s;
    font-family: inherit;
    box-sizing: border-box;
    background: #f8fafc;
}

.form-group input:focus {
    outline: none;
    border-color: #2563eb;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
}

.modal-btn {
    width: 100%;
    padding: 0.85rem;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 0.5rem;
    font-family: inherit;
    box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
}

.modal-btn:hover {
    background: #1d4ed8;
}

.modal-footer {
    margin-top: 1.5rem;
    text-align: center;
    font-size: 0.9rem;
    color: #64748b;
}

.modal-footer a {
    color: #2563eb;
    text-decoration: none;
    font-weight: 600;
    cursor: pointer;
}

.modal-footer a:hover {
    text-decoration: underline;
}

/* Password Toggle */
.password-wrapper {
    position: relative;
    display: flex;
    align-items: center;
}
.password-wrapper input {
    padding-right: 2.75rem;
}
.password-toggle {
    position: absolute;
    right: 0.75rem;
    background: none;
    border: none;
    color: #94a3b8;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: color 0.2s;
}
.password-toggle:hover {
    color: #475569;
}
.password-toggle svg {
    width: 20px;
    height: 20px;
}
.password-toggle .eye-off {
    display: none;
}
.password-toggle.show .eye-on {
    display: none;
}
.password-toggle.show .eye-off {
    display: block;
}

/* Messages */
.django-message {
    padding: 0.75rem;
    border-radius: 8px;
    margin-bottom: 1rem;
    font-size: 0.9rem;
    text-align: center;
    font-weight: 500;
}
.django-message.error {
    background: #fee2e2;
    color: #991b1b;
    border: 1px solid #fecaca;
}
.django-message.success {
    background: #dcfce7;
    color: #166534;
    border: 1px solid #bbf7d0;
}
</style>

<div class="modal-overlay" id="loginModal">
    <div class="login-modal">
        <button class="modal-close" id="closeLoginModal">&times;</button>
        
        <div class="modal-logo">⚖️</div>
        <h2 id="modalTitle">Welcome to LegalAI</h2>
        <p id="modalDesc">Sign in to access your legal workspace.</p>
        
        {% if messages %}
            {% for message in messages %}
                <div class="django-message {{ message.tags }}">{{ message }}</div>
            {% endfor %}
            <script>
                // Auto-open modal if there are auth error messages
                document.addEventListener("DOMContentLoaded", function() {
                    document.getElementById("loginModal").classList.add("active");
                });
            </script>
        {% endif %}
        
        <!-- LOGIN FORM -->
        <form method="POST" action="{% url 'core:auth_login' %}" id="loginForm">
            {% csrf_token %}
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" name="email" required placeholder="name@company.com">
            </div>
            <div class="form-group">
                <label for="login-password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="login-password" name="password" required placeholder="Enter your password">
                    <button type="button" class="password-toggle" onclick="togglePassword(this, 'login-password')">
                        <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="modal-btn">Log In</button>
            <div class="modal-footer">
                Don't have an account? <a onclick="toggleAuthMode('register')">Sign Up</a>
            </div>
        </form>

        <!-- REGISTER FORM (Hidden by default) -->
        <form method="POST" action="{% url 'core:auth_register' %}" id="registerForm" style="display: none;">
            {% csrf_token %}
            <div class="form-group">
                <label for="reg-name">Full Name</label>
                <input type="text" id="reg-name" name="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="reg-email">Email Address</label>
                <input type="email" id="reg-email" name="email" required placeholder="name@company.com">
            </div>
            <div class="form-group">
                <label for="reg-password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="reg-password" name="password" required placeholder="Create a password">
                    <button type="button" class="password-toggle" onclick="togglePassword(this, 'reg-password')">
                        <svg class="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                    </button>
                </div>
            </div>
            <button type="submit" class="modal-btn">Create Account</button>
            <div class="modal-footer">
                Already have an account? <a onclick="toggleAuthMode('login')">Log In</a>
            </div>
        </form>
    </div>
</div>

<script>
    function togglePassword(btn, inputId) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            btn.classList.add('show');
        } else {
            input.type = 'password';
            btn.classList.remove('show');
        }
    }

    function toggleAuthMode(mode) {
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const title = document.getElementById('modalTitle');
        const desc = document.getElementById('modalDesc');

        if (mode === 'register') {
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
            title.textContent = 'Create an Account';
            desc.textContent = 'Sign up to build your legal workspace.';
        } else {
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
            title.textContent = 'Welcome to LegalAI';
            desc.textContent = 'Sign in to access your legal workspace.';
        }
    }

    document.addEventListener("DOMContentLoaded", function() {
        const loginModal = document.getElementById("loginModal");
        const closeBtn = document.getElementById("closeLoginModal");
        
        const elements = document.querySelectorAll("a, button, span");
        
        elements.forEach(el => {
            if (el.textContent.trim() === "Log In" || el.textContent.trim() === "Sign Up") {
                el.addEventListener("click", function(e) {
                    e.preventDefault();
                    if (el.textContent.trim() === "Sign Up") toggleAuthMode('register');
                    else toggleAuthMode('login');
                    loginModal.classList.add("active");
                });
                el.style.cursor = 'pointer';
            }
        });

        closeBtn.addEventListener("click", function() {
            loginModal.classList.remove("active");
        });

        loginModal.addEventListener("click", function(e) {
            if (e.target === loginModal) {
                loginModal.classList.remove("active");
            }
        });
    });
</script>
